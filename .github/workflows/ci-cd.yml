name: CI/CD - Build e Push para o Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

jobs:
  test:
    name: Testes da API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes unitários
        run: npm run test:unit
        env:
          NODE_ENV: test

  build-and-push:
    name: Build e Push das imagens
    needs: test          # só roda se os testes passarem
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            image: ecommerce-api
          - service: frontend
            image: ecommerce-frontend
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push - ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          